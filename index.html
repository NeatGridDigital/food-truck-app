:root{
  --paper:#F7F8F0;--card:#FFFFFF;--ink:#243022;--muted:#5F6B5A;--line:#E1E5D6;--soft:#EEF2E4;
  --avo:#7FA83A;--avo-deep:#4F7A1C;--avo-tint:#EAF3DA;--sun:#F2B705;--sun-ink:#5A4300;--sun-tint:#FDF0C4;
  --brand:#477563;--brand-ink:#FFFFFF;--bad:#B3261E;--bad-tint:#FCE8E6;--ok:#2F5D4C;--ok-tint:#E3EFE9;
  --input:#E7EFEA;--shadow:0 1px 0 rgba(36,48,34,.06),0 6px 18px -10px rgba(36,48,34,.25);
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-look=light]){
  --paper:#131711;--card:#1C221A;--ink:#EEF2EA;--muted:#A8B3A2;--line:#2E3629;--soft:#232A20;
  --avo:#A9D16A;--avo-deep:#B9DB82;--avo-tint:#2A3A1E;--sun:#FFD34D;--sun-ink:#2A2000;--sun-tint:#3E3412;
  --brand:#26352F;--brand-ink:#EEF2EA;--bad:#F28B82;--bad-tint:#3A2422;--ok:#A9C7BB;--ok-tint:#1F3A30;
  --input:#283A33;--shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-look=dark]{
  --paper:#131711;--card:#1C221A;--ink:#EEF2EA;--muted:#A8B3A2;--line:#2E3629;--soft:#232A20;
  --avo:#A9D16A;--avo-deep:#B9DB82;--avo-tint:#2A3A1E;--sun:#FFD34D;--sun-ink:#2A2000;--sun-tint:#3E3412;
  --brand:#26352F;--brand-ink:#EEF2EA;--bad:#F28B82;--bad-tint:#3A2422;--ok:#A9C7BB;--ok-tint:#1F3A30;
  --input:#283A33;--shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.top h1{margin:0;font:800 30px/1.05 var(--cond);letter-spacing:.2px}
.top .sub{font-size:14px;color:var(--muted)}
.brand{display:flex;align-items:center;gap:8px;font:600 15px var(--cond);color:var(--muted)}
.brand svg{width:26px;height:26px}
.banner{background:var(--sun-tint);color:var(--sun-ink);border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px}
:root[data-look=dark] .banner{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-look=light]) .banner{color:var(--sun)}}
h2{font:800 22px/1.15 var(--cond);margin:22px 0 10px}
h3{font:600 17px/1.2 var(--cond);margin:0 0 6px;letter-spacing:.2px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
@media (min-width:720px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}

/* Home: the month board */
.board{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:18px 18px 8px;position:relative;overflow:hidden}
.board .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.board .lab{font-size:14px;opacity:.85}
.board .big{font:800 52px/1 var(--cond);letter-spacing:-.5px}
.board .big small{font-size:24px;font-weight:600;margin-right:2px}
.board .side{display:flex;gap:18px}
.board .side div{min-width:84px}
.board .side b{display:block;font:800 26px/1.1 var(--cond)}
.board .side b.neg{color:#FFB4AB}
.board svg.spark{display:block;width:100%;height:120px;margin-top:6px}
.board .months{display:flex;justify-content:space-between;font-size:12px;opacity:.8;padding:0 2px 6px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font:800 28px/1 var(--cond)}
.ring .c span{font-size:12px;color:var(--muted)}
.fc{display:flex;gap:16px;align-items:center}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat b{font:800 20px var(--cond)}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--avo)}
.bar i.sun{background:linear-gradient(90deg,var(--avo),var(--sun))}
.rank{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .bar{grid-column:1/-1;margin-top:2px}
.rank b{font:800 18px var(--cond)}

/* pills */
.pill{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.warn{background:var(--sun-tint);color:var(--sun-ink)}
:root[data-look=dark] .pill.warn{color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-look=light]) .pill.warn{color:var(--sun)}}
.pill.bad{background:var(--bad-tint);color:var(--bad)}
.pill.wait{background:var(--soft);color:var(--muted)}

/* Service: the ticket rail */
.rail{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.rail{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.rail{grid-template-columns:repeat(4,1fr)}}
.ticket{position:relative;border:0;text-align:left;background:var(--card);border-radius:4px 4px 12px 12px;padding:18px 12px 12px;
  min-height:128px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;touch-action:manipulation;
  -webkit-user-select:none;user-select:none}
.ticket::before{content:"";position:absolute;left:0;right:0;top:-5px;height:10px;
  background:radial-gradient(circle at 7px 0,transparent 5px,var(--card) 5.5px) 0 0/14px 10px repeat-x}
.ticket .nm{font:800 20px/1.05 var(--cond);padding-right:46px}
.ticket .pr{font-size:14px;color:var(--muted)}
.ticket .ct{position:absolute;top:12px;right:10px;min-width:42px;height:42px;padding:0 8px;border-radius:21px;
  display:flex;align-items:center;justify-content:center;font:800 24px var(--cond);background:var(--soft);color:var(--muted)}
.ticket.has .ct{background:var(--sun);color:var(--sun-ink)}
.ticket .minus{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:17px;border:1px solid var(--line);
  background:transparent;font:600 20px/1 var(--body);color:var(--muted);display:none}
.ticket.has .minus{display:block}
.ticket.pop .ct{animation:stamp .28s ease-out}
@keyframes stamp{0%{transform:scale(1)}40%{transform:scale(1.28) rotate(-6deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ticket.pop .ct{animation:none}}
.paybar{display:flex;gap:6px;background:var(--card);border-radius:12px;padding:5px;box-shadow:var(--shadow);margin:0 0 14px}
.paybar button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 4px;font:600 16px var(--body)}
.paybar button.on{background:var(--avo-deep);color:#fff}
:root[data-look=dark] .paybar button.on{color:#131711}
@media (prefers-color-scheme:dark){:root:not([data-look=light]) .paybar button.on{color:#131711}}
.till{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:5;padding:0 16px}
.till .in{max-width:1040px;margin:0 auto;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 10px 10px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.till b{font:800 24px var(--cond)}
.till .grow{flex:1;line-height:1.15}
.till button{border:0;border-radius:10px;padding:11px 14px;font-weight:600;background:var(--sun);color:#2A2000}
.till button.ghost{background:transparent;color:var(--paper);border:1px solid rgba(255,255,255,.3);padding:11px 12px}
.svc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
.svc-head h2{margin:0}

/* lists */
.list{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;
  background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}
.li .m{font-size:14px;color:var(--muted)}
.li .r{text-align:right}
.li .v{font:800 19px var(--cond)}
.li .v.neg{color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 12px;scrollbar-width:none}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;white-space:nowrap;font-size:15px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border:0;background:var(--card);border-radius:14px;padding:14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.tile svg{width:28px;height:28px;stroke:var(--avo-deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font:600 17px var(--cond)}
.tile span{font-size:13px;color:var(--muted)}
.tile.on{outline:2px solid var(--avo)}
.mix{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mix .q{border-radius:14px;padding:12px;min-height:120px}
.mix .q h3{display:flex;justify-content:space-between}
.mix .q.star{background:var(--avo-tint)}.mix .q.work{background:var(--sun-tint)}.mix .q.puz{background:var(--ok-tint)}.mix .q.dog{background:var(--soft)}
.mix .q p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.mix .q ul{margin:0;padding:0;list-style:none;font-size:15px}
.mix .q li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px solid rgba(36,48,34,.08)}.mix .q li b{font-weight:600;font-variant-numeric:tabular-nums}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav .in{display:flex;max-width:620px;width:100%}
nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:12px;color:var(--muted)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--avo-deep)}
nav button.svc svg{width:30px;height:30px;padding:3px;border-radius:15px;background:var(--sun);stroke:#2A2000}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:5;border:0;border-radius:28px;padding:14px 20px;
  background:var(--avo-deep);color:#fff;font-weight:600;box-shadow:0 8px 20px -8px rgba(0,0,0,.45)}
:root[data-look=dark] .fab{color:#131711}
@media (prefers-color-scheme:dark){:root:not([data-look=light]) .fab{color:#131711}}

/* forms and sheets */
.f{display:block;margin:0 0 12px}
.f>span{display:block;font-size:14px;color:var(--muted);margin:0 0 4px}
.i{width:100%;border:1px solid transparent;background:var(--input);border-radius:10px;padding:11px 12px;min-height:46px}
.i:focus{border-color:var(--avo)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end}
@media (max-width:440px){.row3{grid-template-columns:1fr 1fr}.row3>:first-child{grid-column:1/-1}}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--avo-deep);color:#fff;min-height:46px}
:root[data-look=dark] .btn{color:#131711}
@media (prefers-color-scheme:dark){:root:not([data-look=light]) .btn{color:#131711}}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.bad{background:var(--bad-tint);color:var(--bad)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.scrim{position:fixed;inset:0;background:rgba(10,14,9,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .22s ease-out}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin-top:4px}
.sheet .x{float:right;border:0;background:var(--soft);border-radius:16px;width:32px;height:32px;font-size:18px;line-height:1}
.recipe{width:100%;border-collapse:collapse;font-size:15px}
.recipe td{padding:7px 4px;border-bottom:1px solid var(--line)}
.recipe td.n{text-align:right;white-space:nowrap}
.result{margin-top:40px;background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:16px;text-align:center}
.result b{display:block;font:800 46px/1 var(--cond)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:10px;z-index:30;font-size:15px}
.empty{text-align:center;padding:30px 8px}
.empty .art{width:150px;height:auto;margin:0 auto 8px;display:block}
.empty h2{font-size:30px;margin:6px 0}
.empty p{max-width:40ch;margin:0 auto 16px;color:var(--muted)}
table.mini{width:100%;border-collapse:collapse;font-size:14px}
table.mini td,table.mini th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.mini td:first-child,table.mini th:first-child{text-align:left}
table.mini th{font-weight:600;color:var(--muted);font-size:13px}
.neg{color:var(--bad)}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.search{position:relative;margin:0 0 10px}
.search input{padding-left:38px}
.search svg{position:absolute;left:11px;top:13px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.chips button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px 6px 9px;font-size:15px}
.chips svg{width:18px;height:18px;stroke:var(--avo-deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips button.on svg{stroke:var(--paper)}

    ["tsp", "ml", 4.92892], ["gal", "ml", 3785.41], ["each", "each", 1], ["dozen", "each", 12],
    ["portion", "portion", 1]];

  var ROUNDING = ["0.05", "0.25", "0.50", "1.00", "Ends in .99", "No rounding"];
  var STEP = { "0.05": 0.05, "0.25": 0.25, "0.50": 0.5, "1.00": 1, "Ends in .99": 1, "No rounding": 0 };

  function r2(x) { var s = x < 0 ? -1 : 1; return s * Math.round(Math.abs(x) * 100 + 1e-9) / 100; }
  function round6(x) { return Math.round(x * 1e6) / 1e6; }
  function roundPrice(x, mode) {
    x = round6(x);
    if (mode === "No rounding") return r2(x);
    if (mode === "Ends in .99") return x > 0 ? r2(Math.ceil(round6(x)) - 0.01) : 0;

  function num(x) { return typeof x === "number" && isFinite(x) ? x : 0; }

  function compute(S, today) {
    var T = S.settings, asof = S.asOf || today, out = {};
    var ing = {};
    S.ingredients.forEach(function (r) {
      var u = UNIT[r.unit]; if (!r.name || !u || !(r.size > 0) || !(r.price >= 0)) return;

    });
    out.ing = ing;
    var batch = {}, used = {}, lines = [];
    S.lines.forEach(function (l) {
      var u = UNIT[l.unit], g = ing[l.ing], ok = u && g && l.qty > 0 && u.base === g.base;

        !(l.qty > 0) ? "Quantity?" : u.base !== g.base ? "Use " + (g.base === "g" ? "a weight" : g.base === "ml" ? "a volume" : "a count") : "" });

    out.lines = lines; out.used = used;
    var div = T.tax_in === "Yes" ? 1 + T.tax_rate : 1;
    var menu = {};
    S.dishes.forEach(function (d) {
      var b = batch[d.name] || 0, cpp = b / (d.por > 0 ? d.por : 1), price = num(d.price), net = price / div;

      var sugg = cpp ? (T.rounding === "No rounding" ? r2(round6(cpp / T.target * div)) : roundPrice(cpp / T.target * div, T.rounding)) : 0;

      menu[d.name] = { id: d.id, cat: d.cat, por: d.por, price: price, on: d.on || "Yes", batch: b, cpp: cpp, net: net,
        fc: fc, sugg: sugg, margin: margin, pill: pill, sold: 0, profit: 0, mix: "" };
    });
    out.menu = menu;
    var sl = [];
    S.sales.forEach(function (s) {
      var m = menu[s.dish]; if (!m || !(s.qty > 0)) return;
      var p = s.price != null && s.price !== "" ? s.price : m.price; if (!p && p !== 0) return;
      var gross = s.qty * p - num(s.disc), net = gross / div, food = s.qty * m.cpp;
      var pay = s.pay || "Card";
      var fee = pay === "Card" ? gross * T.card_pct + T.card_fix * s.qty / T.items : pay === "App" ? gross * T.app_pct : 0;

        net: net, food: food, fee: fee, pay: pay });
    });
    out.sales = sl;
    // menu mix
    var lo = S.mixFrom ? d2n(S.mixFrom) : -1e9, hi = S.mixTo ? d2n(S.mixTo) : 1e9;
    sl.forEach(function (s) { if (s.n >= lo && s.n <= hi) menu[s.dish].sold += s.qty; });
    var on = Object.keys(menu).filter(function (k) { var m = menu[k]; return m.on === "Yes" && m.pill.indexOf("Check") !== 0 && m.cpp > 0; });

    var avg = tot ? on.reduce(function (a, k) { return a + menu[k].margin * menu[k].sold; }, 0) / tot : 0;

    // events

    });

    });

    for (var k = -11; k <= 0; k++) {
      var a = addMonths(dm, k), b = addMonths(dm, k + 1), an1 = d2n(a), bn = d2n(b);

    sl.forEach(function (s) { ts += s.net; tf += s.food; tfe += s.fee; mset[s.date.slice(0, 7)] = 1; });

    var pts = vals.map(function (v, i) { return [8 + i * (W - 16) / (n - 1), 10 + (1 - v / max) * (H - 26)]; });
    var d = "M" + pts[0][0].toFixed(1) + "," + pts[0][1].toFixed(1);

    var area = d + " L" + pts[n - 1][0].toFixed(1) + "," + (H - 4) + " L" + pts[0][0].toFixed(1) + "," + (H - 4) + " Z";
    var last = pts[n - 1];
    return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="Sales by month, last 12 months">' +
      '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9D16A" stop-opacity=".55"/><stop offset="1" stop-color="#A9D16A" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + area + '" fill="url(#g1)"/><path d="' + d + '" fill="none" stroke="#C9E89A" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="6" fill="#FFD34D" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>' +
      '<div class="months">' + labels.map(function (l, i) { return i % 2 === (n - 1) % 2 ? "<span>" + esc(l) + "</span>" : ""; }).join("") + "</div>";
  }
  function ring(v, target) {
    var r = 50, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, (v || 0) / 0.5)), t = Math.min(1, target / 0.5);
    var over = v > target + S.settings.close, col = over ? "var(--bad)" : v > target ? "var(--sun)" : "var(--avo)";

      '<circle cx="59" cy="59" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (f * c).toFixed(1) + " " + c.toFixed(1) + '"/>' +
      '<circle cx="' + (59 + r * Math.cos(t * 2 * Math.PI)).toFixed(1) + '" cy="' + (59 + r * Math.sin(t * 2 * Math.PI)).toFixed(1) + '" r="4" fill="var(--ink)"/></svg>' +
      '<div class="c"><b>' + pct(v, 1) + "</b><span>target " + pct(target, 0) + "</span></div></div>";
  }

  function spots() { var s = {}; S.events.forEach(function (e) { s[e.name] = 1; }); return Object.keys(s); }

  function tick(name, delta) {
    var sv = S.service, c = sv.counts[name] = sv.counts[name] || {};
    if (delta > 0) { c[sv.pay] = (c[sv.pay] || 0) + 1; sv.log.push([name, sv.pay]); }
    else { var i; for (i = sv.log.length - 1; i >= 0; i--) if (sv.log[i][0] === name) break;
      if (i < 0) return; var p = sv.log[i][1]; sv.log.splice(i, 1); c[p] = Math.max(0, (c[p] || 0) - 1); }

      S.service = { event: name, type: f.type, start: f.start || nowTime(), date: today(), counts: {}, log: [], pay: "Card" }; save(); render(); }
    else if (el.id === "csf") { doCloseService(f); }
    else if (el.id === "dishf") { if (saveDish(f, el)) render(); }
    else if (el.id === "evf") { if (!f.name.trim()) { toast("Type a name"); return; }
      upsert("events", { id: el.dataset.id, date: f.date, name: f.name.trim(), type: f.type, start: f.start, end: f.end, flat: parseNum(f.flat) || 0, pct: (parseNum(f.pct) || 0) / 100,
        other: parseNum(f.other) || 0, staff: parseNum(f.staff) || 0, rate: parseNum(f.rate) || 0, note: "" }); save(); closeSheet(); render(); toast("Event saved"); }
    else if (el.id === "ingf") { var n = f.name.trim(), old = el.dataset.old; if (!n || !(parseNum(f.size) > 0) || parseNum(f.price) == null) { toast("Name, pack size and price, please"); return; }
      upsert("ingredients", { id: el.dataset.id, name: n, cat: f.cat, size: parseNum(f.size), unit: f.unit, price: parseNum(f.price), use: f.use ? parseNum(f.use) / 100 : null, supplier: f.supplier, note: "" });
      if (old && old !== n) S.lines.forEach(function (l) { if (l.ing === old) l.ing = n; });
      save(); closeSheet(); render(); toast("Saved. Dishes updated."); }
    else if (el.id === "expf") { var amt = parseNum(f.amount); if (amt == null) { toast("Type an amount"); return; }
      S.expenses.push({ id: uid("x"), date: f.date, cat: f.cat, desc: f.desc, amount: amt }); save(); render(); toast("Expense added"); }
    else if (el.id === "wstf") { var q = parseNum(f.qty); if (!f.item || !(q > 0)) { toast("Pick what and how much"); return; }
      S.waste.push({ id: uid("w"), date: today(), item: f.item, qty: q, unit: R.menu[f.item] ? "portion" : f.unit, reason: f.reason }); save(); render(); toast("Waste added"); }
    else if (el.id === "fixf") { var out = [], i = 0; while (("fi" + i) in f) { if (f["fi" + i] || f["fa" + i]) out.push({ item: f["fi" + i], amount: parseNum(f["fa" + i]) || 0 }); i++; }
      S.fixed = out; save(); render(); toast("Fixed costs saved"); }
    else if (el.id === "projf") { S.proj = { start: f.start, first: parseNum(f.first) || 0, growth: (parseNum(f.growth) || 0) / 100 }; save(); render(); }
    else if (el.id === "setf") { var T = S.settings, P = function (k) { var x = parseNum(f[k]); return x == null ? T[k] : x / 100; }, N = function (k) { var x = parseNum(f[k]); return x == null ? T[k] : x; };
      Object.assign(T, { biz: f.biz, cur: f.cur, target: P("target"), close: P("close"), rounding: f.rounding, tax_in: f.tax_in, tax_rate: P("tax_rate"), card_pct: P("card_pct"),
        card_fix: N("card_fix"), items: N("items") || 1, app_pct: P("app_pct"), good_hr: N("good_hr"), days: N("days") || 22, look: f.look });
      save(); render(); toast("Settings saved"); }
  });

  // ---------------------------------------------------------------- start
  store.get(KEY).then(function (v) { S = v ? Object.assign(clone(DEF), v) : clone(DEF); render(); });
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body></html>
